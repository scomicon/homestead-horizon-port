# Logistics slice: Package item, Packager, Factory Gauge (local monitor).
# This file is a fragment: append it to mixins/create/horizon-mixin.toml (or merge it
# in the mixin tool's plan). Nothing here edits an existing injection; every hook is
# an additional helper on the same hook, as the homestead bundle does for its pots.
# Helper functions are named create_logistics_* / create_gauge_*.

[[module]]
id = "package-runtime"
file = "crates/horizon-client/src/game.rs"
name = "create_port_package"
source = "package_runtime.rs"

[[module]]
id = "packager-runtime"
file = "crates/horizon-client/src/game.rs"
name = "create_port_packager"
source = "packager_runtime.rs"

[[module]]
id = "gauge-runtime"
file = "crates/horizon-client/src/game.rs"
name = "create_port_gauge"
source = "gauge_runtime.rs"

[[injection]]
id = "logistics-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "packager_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "logistics-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "packager_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "logistics-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "packager_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut crate::containers::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "logistics-update-tag"
hook = "block_entity_update_tag"
hook_version = 1
kind = "HEAD"
helper = "packager_update_tag.rs"
bindings = [
  { name = "entity", ty = "&crate::containers::ModBlockEntity", value = "entity" },
  { name = "tag", ty = "&mut Option<horizon_world::nbt::Compound>", value = "&mut *tag" },
]

[[injection]]
id = "logistics-draw"
hook = "block_entity_submit"
hook_version = 1
kind = "HEAD"
helper = "packager_draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&crate::containers::ModBlockEntity", value = "entity" },
  { name = "draw", ty = "&mut crate::game::native_block_entity_draw::BlockEntityDraw", value = "&mut *draw" },
]

[[injection]]
id = "logistics-container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "packager_container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<crate::containers::ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "logistics-right-click"
hook = "right_click_block"
hook_version = 1
kind = "HEAD"
helper = "packager_right_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "logistics-destroy"
hook = "destroy_block"
hook_version = 1
kind = "HEAD"
helper = "packager_destroy.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "logistics-placed"
hook = "place_block"
hook_version = 1
kind = "HEAD"
helper = "packager_placed.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&crate::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
]

[[injection]]
id = "gauge-signal"
hook = "block_signal"
hook_version = 1
kind = "HEAD"
helper = "gauge_signal.rs"
bindings = [
 {name="game",ty="&crate::game::GameLevel<'_>",value="self"},
 {name="pos",ty="horizon_core::position::BlockPos",value="pos"},
 {name="state",ty="horizon_world::registry::BlockStateId",value="state"},
 {name="face",ty="horizon_core::geometry::Direction",value="face"},
 {name="direct",ty="bool",value="direct"},
 {name="signal",ty="&mut i32",value="&mut *signal"},
]

[[injection]]
id = "gauge-signal-source"
hook = "is_signal_source"
hook_version = 1
kind = "HEAD"
helper = "gauge_source.rs"
bindings = [
 {name="game",ty="&crate::game::GameLevel<'_>",value="self"},
 {name="state",ty="horizon_world::registry::BlockStateId",value="state"},
 {name="source",ty="&mut bool",value="&mut *source"},
]