# Redstone switches + Nixie tube (module create_port_switch, switch_runtime.rs).
# Append this file verbatim to mixins/create/horizon-mixin.toml (after the
# link-flush injection). Every injection is an additional HEAD helper on a hook
# that already has other injections; each helper acts only on its own blocks.

[[module]]
id = "switch-runtime"
file = "crates/horizon-client/src/game.rs"
name = "create_port_switch"
source = "switch_runtime.rs"

[[injection]]
id = "switch-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "switch_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "switch-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "switch_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "switch-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "switch_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut crate::containers::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "switch-update-tag"
hook = "block_entity_update_tag"
hook_version = 1
kind = "HEAD"
helper = "switch_update_tag.rs"
bindings = [
  { name = "entity", ty = "&crate::containers::ModBlockEntity", value = "entity" },
  { name = "tag", ty = "&mut Option<horizon_world::nbt::Compound>", value = "&mut *tag" },
]

[[injection]]
id = "switch-draw"
hook = "block_entity_submit"
hook_version = 1
kind = "HEAD"
helper = "switch_draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "block", ty = "&str", value = "block" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "entity", ty = "&crate::containers::ModBlockEntity", value = "entity" },
  { name = "draw", ty = "&mut crate::game::native_block_entity_draw::BlockEntityDraw", value = "&mut *draw" },
]

[[injection]]
id = "switch-right-click"
hook = "right_click_block"
hook_version = 1
kind = "HEAD"
helper = "switch_right_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "switch-placement"
hook = "state_for_placement"
hook_version = 1
kind = "HEAD"
helper = "switch_placement.rs"
bindings = [
 {name="game",ty="&crate::game::GameLevel<'_>",value="self"},
 {name="state",ty="horizon_world::registry::BlockStateId",value="state"},
 {name="context",ty="&horizon_world::level::PlacementContext",value="context"},
 {name="answer",ty="&mut Option<Option<horizon_world::registry::BlockStateId>>",value="&mut *answer"},
]

[[injection]]
id = "switch-signal"
hook = "block_signal"
hook_version = 1
kind = "HEAD"
helper = "switch_signal.rs"
bindings = [
 {name="game",ty="&crate::game::GameLevel<'_>",value="self"},
 {name="pos",ty="horizon_core::position::BlockPos",value="pos"},
 {name="state",ty="horizon_world::registry::BlockStateId",value="state"},
 {name="face",ty="horizon_core::geometry::Direction",value="face"},
 {name="direct",ty="bool",value="direct"},
 {name="signal",ty="&mut i32",value="&mut *signal"},
]

[[injection]]
id = "switch-signal-source"
hook = "is_signal_source"
hook_version = 1
kind = "HEAD"
helper = "switch_source.rs"
bindings = [
 {name="game",ty="&crate::game::GameLevel<'_>",value="self"},
 {name="state",ty="horizon_world::registry::BlockStateId",value="state"},
 {name="source",ty="&mut bool",value="&mut *source"},
]

[[injection]]
id = "switch-survival"
hook = "can_survive"
hook_version = 1
kind = "HEAD"
helper = "switch_survival.rs"
bindings = [
 {name="game",ty="&crate::game::GameLevel<'_>",value="self"},
 {name="pos",ty="horizon_core::position::BlockPos",value="pos"},
 {name="state",ty="horizon_world::registry::BlockStateId",value="state"},
 {name="survives",ty="&mut Option<bool>",value="&mut *survives"},
]

[[injection]]
id = "switch-shape"
hook = "update_shape"
hook_version = 1
kind = "HEAD"
helper = "switch_shape.rs"
bindings = [
 {name="game",ty="&crate::game::GameLevel<'_>",value="self"},
 {name="state",ty="horizon_world::registry::BlockStateId",value="state"},
 {name="direction",ty="horizon_core::geometry::Direction",value="direction"},
 {name="neighbour",ty="horizon_world::registry::BlockStateId",value="neighbour"},
 {name="new",ty="&mut Option<horizon_world::registry::BlockStateId>",value="&mut *new"},
]

[[injection]]
id = "switch-flush"
hook = "level_tick_post"
hook_version = 1
kind = "HEAD"
helper = "switch_flush.rs"
bindings = [
 {name="game",ty="&mut crate::game::Game<'_>",value="&mut *self"},
 {name="dimension",ty="&str",value="dimension"},
]