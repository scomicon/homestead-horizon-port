# Schematic tools: Schematic and Quill (export) and the Schematic item's deploy / rotate / mirror
# / anchor handling. Append this whole file to mixins/create/horizon-mixin.toml (after
# fragments/schematic.toml was applied). The helper files (schematool_*.rs) live in
# mixins/create beside horizon-mixin.toml. See fragments/schematic_tools.md for the shared-file
# edits this needs (content.py, catalog.py, fallback_textures, acceptance wiring).

[[module]]
id = "schematic-tool-runtime"
file = "crates/horizon-client/src/game.rs"
name = "create_port_schematic_tool"
source = "schematic_tool_runtime.rs"

# `create schematool ...` operator commands. Own root, so they never meet `create schematic ...`
# (schematic_command.rs claims every line under that root) or `create cannon ...`.
[[injection]]
id = "schematool-register"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "schematool_register.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "commands", ty = "&mut Vec<crate::mod_api::NativeCommand>", value = "&mut *commands" },
]

[[injection]]
id = "schematool-command"
hook = "perform_command"
hook_version = 1
kind = "HEAD"
helper = "schematool_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&crate::mod_api::NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

# Right click on a block: Quill corner / Schematic deploy.
[[injection]]
id = "schematool-use-on"
hook = "use_item_on"
hook_version = 1
kind = "HEAD"
helper = "schematool_use_on.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&crate::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

# Sneak + right click in the air: discard the Quill selection.
[[injection]]
id = "schematool-use-item"
hook = "use_item"
hook_version = 1
kind = "HEAD"
helper = "schematool_use_item.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&crate::items::ItemStack", value = "stack" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]
