# Display Link + Display Board (redstone displays slice).
# Append this whole file to mixins/create/horizon-mixin.toml (or have the build
# merge fragments/*.toml). Every id is prefixed "display-" and every helper
# function "create_display_*" so nothing collides with the existing injections.
# Several injections on one hook already coexist in the base file (three on
# can_survive), so the shared hooks below only add helpers.

[[module]]
id = "display-source"
file = "crates/horizon-client/src/game.rs"
name = "create_port_display_source"
source = "display_source.rs"

[[module]]
id = "display-board-runtime"
file = "crates/horizon-client/src/game.rs"
name = "create_port_display_board"
source = "display_board_runtime.rs"

[[module]]
id = "display-link-runtime"
file = "crates/horizon-client/src/game.rs"
name = "create_port_display_link"
source = "display_link_runtime.rs"

[[injection]]
id = "display-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "display_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "display-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "display_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "display-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "display_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut crate::containers::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "display-update-tag"
hook = "block_entity_update_tag"
hook_version = 1
kind = "HEAD"
helper = "display_update_tag.rs"
bindings = [
  { name = "entity", ty = "&crate::containers::ModBlockEntity", value = "entity" },
  { name = "tag", ty = "&mut Option<horizon_world::nbt::Compound>", value = "&mut *tag" },
]

[[injection]]
id = "display-draw"
hook = "block_entity_submit"
hook_version = 1
kind = "HEAD"
helper = "display_draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "block", ty = "&str", value = "block" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "entity", ty = "&crate::containers::ModBlockEntity", value = "entity" },
  { name = "draw", ty = "&mut crate::game::native_block_entity_draw::BlockEntityDraw", value = "&mut *draw" },
]

[[injection]]
id = "display-render-bounds"
hook = "block_entity_render_bounding_box"
hook_version = 1
kind = "HEAD"
helper = "display_bounds.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "pos", ty = "[i32;3]", value = "pos" },
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&crate::containers::ModBlockEntity", value = "entity" },
  { name = "bounds", ty = "&mut [f32;6]", value = "&mut *bounds" },
]

[[injection]]
id = "display-right-click"
hook = "right_click_block"
hook_version = 1
kind = "HEAD"
helper = "display_right_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "display-placement"
hook = "state_for_placement"
hook_version = 1
kind = "HEAD"
helper = "display_placement.rs"
bindings = [
  { name = "game", ty = "&crate::game::GameLevel<'_>", value = "self" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "context", ty = "&horizon_world::level::PlacementContext", value = "context" },
  { name = "answer", ty = "&mut Option<Option<horizon_world::registry::BlockStateId>>", value = "&mut *answer" },
]

[[injection]]
id = "display-survival"
hook = "can_survive"
hook_version = 1
kind = "HEAD"
helper = "display_survival.rs"
bindings = [
  { name = "game", ty = "&crate::game::GameLevel<'_>", value = "self" },
  { name = "pos", ty = "horizon_core::position::BlockPos", value = "pos" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "survives", ty = "&mut Option<bool>", value = "&mut *survives" },
]

[[injection]]
id = "display-shape"
hook = "update_shape"
hook_version = 1
kind = "HEAD"
helper = "display_shape.rs"
bindings = [
  { name = "game", ty = "&crate::game::GameLevel<'_>", value = "self" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "direction", ty = "horizon_core::geometry::Direction", value = "direction" },
  { name = "neighbour", ty = "horizon_world::registry::BlockStateId", value = "neighbour" },
  { name = "new", ty = "&mut Option<horizon_world::registry::BlockStateId>", value = "&mut *new" },
]