# injection). Module and injection ids carry the prefix `sound-` and are unique in the bundle.
#
# Both hooks are CLIENT hooks:
#   * native_sound_play is a free function of the client crate (sound_playback.rs): the
#     engine calls it on the game thread for every sound that starts or updates; it has no Game.
