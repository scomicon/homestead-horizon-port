[mod]
id = "homestead"
version = "0.1.0+homestead.8"

[compatibility]
horizon_revision = "4e5296d1800b3f89f2ae48dfd99d431801df4d46"

[[module]]
id = "harvest"
file = "crates/horizon-client/src/game.rs"
name = "homestead_harvest"
source = "harvest.rs"

[[injection]]
id = "right-click"
hook = "right_click_block"
hook_version = 1
kind = "HEAD"
helper = "right_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# Secure Crops (rules on in Homestead).
[[injection]]
id = "trample"
target = "horizon_client::game::native_hooks::Game<'_>::native_trample"
kind = "HEAD"
helper = "trample.rs"
bindings = [
  { name = "cancel", ty = "&mut bool", value = "&mut *cancel" },
]

# Too Cheap! (maxLevelCost 2147483647): AnvilMenu.createResult drops its result at
# 40 levels unless the player is in creative mode, so the menu asks for the
# creative answer; the anvil screen's "Too Expensive!" line has the same limit.
[[injection]]
id = "anvil-limit-menu"
target = "horizon_client_lib::stations::anvil_result"
kind = "HEAD"
cancellable = true
helper = "anvil_limit.rs"
bindings = [
  { name = "enchantments", ty = "&Enchantments", value = "e" },
  { name = "items", ty = "&Items", value = "items" },
  { name = "input", ty = "Option<&ItemStack>", value = "input" },
  { name = "addition", ty = "Option<&ItemStack>", value = "addition" },
  { name = "name", ty = "Option<&str>", value = "name" },
  { name = "hover_name", ty = "&str", value = "hover_name" },
  { name = "creative", ty = "bool", value = "creative" },
]
