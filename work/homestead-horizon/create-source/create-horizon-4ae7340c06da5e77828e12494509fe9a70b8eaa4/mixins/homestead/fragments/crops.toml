# Farmer's Delight crops (module homestead_crops, crops.rs).
# Append this file verbatim to mixins/homestead/horizon-mixin.toml (after the last injection).
# Both injections are additional HEAD helpers on hooks that already have other injections;
# each helper acts only on its own blocks.

[[module]]
id = "crops"
file = "crates/horizon-client/src/game.rs"
name = "homestead_crops"
source = "crops.rs"

[[injection]]
id = "crops-tick"
hook = "random_tick"
hook_version = 1
kind = "HEAD"
helper = "crops_tick.rs"
bindings = [
  { name = "level", ty = "&mut crate::game::GameLevel<'_>", value = "&mut *self" },
  { name = "ticks", ty = "&mut horizon_world::level::Ticks", value = "&mut *ticks" },
  { name = "pos", ty = "horizon_core::position::BlockPos", value = "pos" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
]

[[injection]]
id = "crops-use"
hook = "right_click_block"
hook_version = 1
kind = "HEAD"
helper = "crops_use.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]
