# Farmer's Delight stage 23: baskets and cabinets (module homestead_storage, storage.rs) and mushroom
# colonies (module homestead_colony, colony.rs).
# Append this file verbatim to mixins/homestead/horizon-mixin.toml (after the last injection).
# Every injection is an additional HEAD helper on a hook that other modules already use; each
# helper acts only on its own blocks (the baskets and cabinets, rich soil above a colony).

[[module]]
id = "storage"
file = "crates/horizon-client/src/game.rs"
name = "homestead_storage"
source = "storage.rs"

[[injection]]
id = "storage-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "storage_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "storage-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "storage_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "storage-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "storage_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut crate::containers::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "storage-container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "storage_container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<crate::containers::ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "storage-placement"
hook = "state_for_placement"
hook_version = 1
kind = "HEAD"
helper = "storage_placement.rs"
bindings = [
 {name="game",ty="&crate::game::GameLevel<'_>",value="self"},
 {name="state",ty="horizon_world::registry::BlockStateId",value="state"},
 {name="context",ty="&horizon_world::level::PlacementContext",value="context"},
 {name="answer",ty="&mut Option<Option<horizon_world::registry::BlockStateId>>",value="&mut *answer"},
]

[[module]]
id = "colony"
file = "crates/horizon-client/src/game.rs"
name = "homestead_colony"
source = "colony.rs"

[[injection]]
id = "colony-tick"
hook = "random_tick"
hook_version = 1
kind = "HEAD"
helper = "colony_tick.rs"
bindings = [
  { name = "level", ty = "&mut crate::game::GameLevel<'_>", value = "&mut *self" },
  { name = "ticks", ty = "&mut horizon_world::level::Ticks", value = "&mut *ticks" },
  { name = "pos", ty = "horizon_core::position::BlockPos", value = "pos" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
]
